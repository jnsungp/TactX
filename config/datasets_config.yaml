# ============================================================
# Cross-Modal Dataset: Daimon (depth from s0) + eFlesh (magnetic)
# 1 objects: cylinder (6568) = 6568 frames
# Contact filter: both sensors must be in contact
# Stats computed from all 1 training objects combined
# ============================================================
dataset_cross_modal:
  dataset_type: 'cross_modal'

  daimon_transforms:
    - 'resize'
    - 'normalize'

  eflesh_transforms:
    - 'normalize'

  image_size: 224
  daimon_channels: 3

  daimon_stats:
    mean: [0.134663, 0.134663, 0.134663]
    std: [0.300324, 0.300324, 0.300324]

  eflesh_stats:
    mean: [93.393188, -1016.577698, -220.003250, -303.440826, -354.737030, 936.931030, 342.367950, 520.851562, -1558.643677, -290.453156, -70.092865, -28.904160, -843.458679, 99.518639, -106.165939]
    std: [108.624695, 442.273163, 321.862000, 191.764038, 198.478561, 564.907288, 197.362946, 207.386520, 758.231201, 256.580872, 303.154694, 212.113861, 392.785767, 243.749603, 169.661346]

  daimon_path: 'processed_data/cross_modal/daimon'
  eflesh_path: 'processed_data/cross_modal/eflesh'

  n_classes_training: 1
  n_classes_test: 0

  tools:
    training_tools:
      - 'cylinder'

    val_tools:
      - 'cylinder_val'

    test_tools: []