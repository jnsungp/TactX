# ============================================================
# Cross-Modal Dataset: Daimon (depth from s0) + eFlesh (magnetic)
# 5 objects: can (3312), cylinder (6568), large_ball (6679), pen (4035), small_ball (10042) = 30636 frames
# Contact filter: both sensors must be in contact
# Stats computed from all 5 training objects combined
# ============================================================
dataset_cross_modal:
  dataset_type: 'cross_modal'

  daimon_transforms:
    - 'resize'
    - 'normalize'

  eflesh_transforms:
    - 'normalize'

  image_size: 224
  daimon_channels: 3

  daimon_stats:
    mean: [0.126311, 0.126311, 0.126311]
    std: [0.324535, 0.324535, 0.324535]

  eflesh_stats:
    mean: [137.958664, -899.769592, -210.221817, -264.862946, -290.407227, 797.167053, 324.655396, 587.242126, -1465.970825, -333.126312, -185.841537, 9.572333, -783.616577, 80.624771, -121.709534]
    std: [216.976532, 664.938538, 319.759247, 289.498688, 301.617401, 605.135986, 291.086273, 374.469269, 1039.518433, 381.615387, 491.967896, 219.396225, 571.922791, 206.743469, 209.363998]

  daimon_path: 'processed_data/cross_modal/daimon'
  eflesh_path: 'processed_data/cross_modal/eflesh'

  n_classes_training: 5
  n_classes_test: 0

  tools:
    training_tools:
      - 'can'
      - 'cylinder'
      - 'large_ball'
      - 'pen'
      - 'small_ball'

    val_tools:
      - 'can_val'
      - 'cylinder_val'
      - 'large_ball_val'
      - 'pen_val'
      - 'small_ball_val'

    test_tools: []

# ============================================================
# Tri-modal cross_modal: Daimon + eFlesh + FlexiTac (pair-only)
# Layout: latent_data_processed/{de_pair, ef_pair, fd_pair}/{sensor}/ep****_fr****.pt
# Files are RAW tensors (not dicts):
#   daimon : (3, 240, 320), eflesh : (15,), flexi : (12, 16)
# Stats below are placeholders; populate with scripts/compute_tri_stats.py.
# ============================================================
dataset_cross_modal_tri:
  dataset_type: 'cross_modal_tri'
  data_root: 'latent_data_processed'

  image_size: 224

  daimon_transforms:
    - 'resize'
    - 'normalize'
  # daimon: 6609 files (de_pair=3252 + fd_pair=3357)
  daimon_stats:
    mean: [0.091920, -0.043407, -0.045044]
    std:  [0.230129, 0.136415, 0.112977]

  eflesh_transforms:
    - 'normalize'
  # eflesh: 8894 files (de_pair=3252 + ef_pair=5642)
  eflesh_stats:
    mean: [26.782779, -514.703113, 115.995235, -2023.415566, 7.838985, 1047.581115, 223.107125, 2531.489869, -1088.107298, -21.523144, -2981.299712, -30.560990, -1813.462424, -38.179990, 218.029818]
    std:  [786.388902, 1407.679265, 598.348392, 2106.474565, 532.395415, 1565.877061, 654.217583, 2274.906212, 1613.502900, 663.628286, 2402.268524, 744.133281, 2340.596627, 331.950135, 697.778074]

  flexitac_transforms:
    - 'normalize'
  # flexi: 8999 files (ef_pair=5642 + fd_pair=3357)
  flexitac_stats:
    mean: 0.073024
    std:  0.169825

  pairs:
    de:
      sensor_a: 'daimon'
      sensor_b: 'eflesh'
      root:    'de_pair'
    ef:
      sensor_a: 'eflesh'
      sensor_b: 'flexi'
      root:    'ef_pair'
    fd:
      sensor_a: 'flexi'
      sensor_b: 'daimon'
      root:    'fd_pair'

