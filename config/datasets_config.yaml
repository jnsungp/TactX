# ============================================================
# Cross-Modal Dataset: Daimon (depth from s0) + eFlesh (magnetic)
# 5 objects: can (3312), cylinder (6568), large_ball (6679), pen (4035), small_ball (10042) = 30636 frames
# Contact filter: both sensors must be in contact
# Stats computed from all 5 training objects combined
# ============================================================
dataset_cross_modal:
  dataset_type: 'cross_modal'

  daimon_transforms:
    - 'resize'
    - 'normalize'

  eflesh_transforms:
    - 'normalize'

  image_size: 224
  daimon_channels: 3

  daimon_stats:
    mean: [0.126311, 0.126311, 0.126311]
    std: [0.324535, 0.324535, 0.324535]

  eflesh_stats:
    mean: [137.958664, -899.769592, -210.221817, -264.862946, -290.407227, 797.167053, 324.655396, 587.242126, -1465.970825, -333.126312, -185.841537, 9.572333, -783.616577, 80.624771, -121.709534]
    std: [216.976532, 664.938538, 319.759247, 289.498688, 301.617401, 605.135986, 291.086273, 374.469269, 1039.518433, 381.615387, 491.967896, 219.396225, 571.922791, 206.743469, 209.363998]

  daimon_path: 'processed_data/cross_modal/daimon'
  eflesh_path: 'processed_data/cross_modal/eflesh'

  n_classes_training: 5
  n_classes_test: 0

  tools:
    training_tools:
      - 'can'
      - 'cylinder'
      - 'large_ball'
      - 'pen'
      - 'small_ball'

    val_tools:
      - 'can_val'
      - 'cylinder_val'
      - 'large_ball_val'
      - 'pen_val'
      - 'small_ball_val'

    test_tools: []