simclr:
  # train options
  seed: 42 # sacred handles automatic seeding when passed in the config
  batch_size: 128
  start_epoch: 0
  epochs: 100
  pretrain: True
  learning_rate: 0.0003
  learning_rate_weights: 0.2
  learning_rate_biases: 0.0048

  # model options
  resnet: "resnet50"
  projection_dim: 64 # "[...] to project the representation to a 128-dimensional latent space"

  # loss options
  optimizer: "Adam" # or LARS (experimental)
  weight_decay: 1.0e-6 # "optimized using LARS [...] and weight decay of 10−6"
  temperature: 0.5 # see appendix B.7.: Optimal temperature under different batch sizes

  # logistic regression options
  logistic_batch_size: 256
  logistic_epochs: 20

cross_modal:
  # train options
  seed: 42
  batch_size: 64
  start_epoch: 0
  epochs: 100
  pretrain: True
  learning_rate: 0.0001

  # image encoder (Daimon) options
  resnet: "resnet18"  # ResNet-18 for 320x240 tactile images (output: 512-dim)

  # magnetic encoder (eFlesh) options
  magnetic_input_dim: 15     # 5 magnets × 3 axes (x, y, z)
  magnetic_hidden_dims: [64, 128, 256]  # MLP hidden layer dims → output auto-matches ResNet

  # projection head options
  projection_dim: 16  # shared latent space dimension for contrastive loss

  # loss options
  optimizer: "Adam"
  weight_decay: 1.0e-4
  temperature: 0.03  # NT-Xent / CWCL temperature

  # cross-modal loss selection: 'infonce' (default, NT-Xent) or 'cwcl'
  # CWCL uses continuous soft weights w_ij = exp(-|f_i - f_j| / cwcl_sigma)
  # within the same tool (and same episode if cwcl_same_episode_only is true).
  loss: 'cwcl'
  cwcl_sigma: 5.0                 # frame-distance decay (larger -> wider soft positives)
  cwcl_same_episode_only: true    # if false, decay applies across episodes of same tool

  # logistic regression options
  logistic_batch_size: 256
  logistic_epochs: 20

cross_modal_vae:
  # train options
  seed: 42
  batch_size: 64
  start_epoch: 0
  epochs: 100
  pretrain: True
  learning_rate: 1.0e-4

  # image encoder (Daimon) options
  resnet: "resnet18"

  # magnetic encoder (eFlesh) options
  magnetic_input_dim: 15
  magnetic_hidden_dims: [64, 128, 256]

  # projection head options (VAE: head outputs 2*projection_dim for (mu, logvar))
  projection_dim: 16

  # loss options
  optimizer: "Adam"
  weight_decay: 1.0e-4
  temperature: 0.03  # NT-Xent temperature applied to mu_i, mu_j

  # VAE + reconstruction weights
  lambda_recon: 1.0     # weight for 4-branch L1 reconstruction
  beta_max: 0.01        # maximum KL weight after warm-up
  kl_warmup_epochs: 30  # linear warm-up: beta goes 0 -> beta_max over this many epochs

  # decoder architecture
  # image_decoder_channels = list of channel widths for ConvTranspose2d stack.
  # Each entry doubles the spatial side; starting resolution is out_size / 2**len.
  # With out_size=224 and 4 entries, start=14 and output=224.
  image_out_channels: 3
  image_out_size: 224
  image_decoder_channels: [256, 128, 64, 32]
  magnetic_decoder_hidden: [256, 128, 64]

  # logistic regression options
  logistic_batch_size: 256
  logistic_epochs: 20

cross_modal_vae3:
  # Tri-modal pair-only joint training (Daimon + eFlesh + FlexiTac).
  # Each step samples one batch from each of de_pair / ef_pair / fd_pair and
  # optimizes a single combined loss: 3-pair InfoNCE(mu) + 12-branch L1 recon
  # + 6 KL terms. Shared N(0,I) prior anchors all three modalities into one
  # latent space; the unobserved D-F pair is aligned transitively.
  seed: 42
  batch_size: 64
  start_epoch: 0
  epochs: 100
  pretrain: True
  learning_rate: 1.0e-4

  # Daimon image encoder (ResNet)
  resnet: "resnet18"

  # eFlesh magnetic encoder (MLP)
  magnetic_input_dim: 15
  magnetic_hidden_dims: [64, 128, 256]

  # FlexiTac encoder/decoder.
  #
  # flexitac_arch:
  #   'small_cnn' (default, omit key for legacy behavior):
  #       2-conv FlexiTacEncoder + 2-convT FlexiTacDecoder. Uses
  #       flexitac_encoder_channels / flexitac_pool_* / flexitac_decoder_channels.
  #       Backward-compatible with all existing cross_modal_vae3 checkpoints.
  #   'residual':
  #       Deeper residual CNN (GN+GELU, 3 stages, 2 downsamples).
  #       For NEW runs only — state_dict differs from small_cnn so old
  #       checkpoints will fail to load. Useful when FlexiTac recon / probe
  #       lag the other modalities (a small_cnn capacity bottleneck).
  #       Tweak via:
  #           flexitac_encoder_block_channels: [64, 128, 256]
  #           flexitac_encoder_blocks_per_stage: [2, 2, 2]
  #           flexitac_decoder_block_channels: [256, 128, 64]
  #           flexitac_decoder_blocks_per_stage: [2, 2, 2]
  #           flexitac_gn_groups: 8
  flexitac_in_h: 12
  flexitac_in_w: 16
  flexitac_arch: 'residual'
  flexitac_encoder_channels: [32, 64]
  flexitac_pool_h: 6
  flexitac_pool_w: 8
  flexitac_decoder_channels: [64, 32]
  flexitac_out_channels: 1

  # projection head options (each modality outputs 2*projection_dim for (mu, logvar))
  projection_dim: 16

  # loss options
  optimizer: "Adam"
  weight_decay: 1.0e-4
  temperature: 0.01

  lambda_recon: 1.0
  beta_max: 0.1
  kl_warmup_epochs: 30

  # InfoNCE curriculum: reconstruction-first, contrastive-later.
  # InfoNCE weight α stays 0 until infonce_warmup_start, then linearly
  # ramps from 0 → 1 over infonce_warmup_epochs.
  infonce_warmup_start: 0
  infonce_warmup_epochs: 0


  # Daimon decoder
  image_out_channels: 3
  image_out_size: 224
  image_decoder_channels: [256, 128, 64, 32]
  magnetic_decoder_hidden: [256, 128, 64]

  logistic_batch_size: 256
  logistic_epochs: 20

cross_modal_clr3:
  # Tri-modal PLAIN-CONTRASTIVE baseline (Daimon + eFlesh + FlexiTac).
  # Same three encoders as cross_modal_vae3, but plain projection heads and
  # NO decoders / NO KL. Each step samples one batch from each of
  # de_pair / ef_pair / fd_pair and optimizes a single combined loss:
  # 3-pair NT-Xent contrastive in the shared latent space, applied at full
  # weight from epoch 0. The lean reconstruction-free baseline.
  seed: 42
  batch_size: 64
  start_epoch: 0
  epochs: 100
  pretrain: True
  learning_rate: 1.0e-4

  # Daimon image encoder (ResNet)
  resnet: "resnet18"

  # eFlesh magnetic encoder (MLP)
  magnetic_input_dim: 15
  magnetic_hidden_dims: [64, 128, 256]

  # FlexiTac small CNN encoder
  flexitac_in_h: 12
  flexitac_in_w: 16
  flexitac_encoder_channels: [32, 64]
  flexitac_pool_h: 6
  flexitac_pool_w: 8
  # Unused by the contrastive model (no decoders); kept only because
  # train_tri's startup print reads model_details['flexitac_decoder_channels'].
  flexitac_decoder_channels: [64, 32]

  # shared latent space dimension (contrastive projection-head output)
  projection_dim: 16

  # loss / optimizer
  optimizer: "Adam"
  weight_decay: 1.0e-4
  temperature: 0.03  # NT-Xent temperature

  logistic_batch_size: 256
  logistic_epochs: 20

barlow_twins:
  # train options
  seed: 42 # sacred handles automatic seeding when passed in the config
  batch_size: 128
  start_epoch: 0
  epochs: 100
  pretrain: True 
  learning_rate: 0.003 # Used for Adam optimizer 
  learning_rate_weights: 0.2
  learning_rate_biases: 0.0048

  # model options
  resnet: "resnet50"
  projector: '8192-8192-8192'
  lambd: 0.0051

  # loss options
  optimizer: "LARS" # or LARS (experimental)
  weight_decay: 1.0e-6 # "optimized using LARS [...] and weight decay of 10−6"

  # logistic regression options
  logistic_batch_size: 256
  logistic_epochs: 500

T3:
  train:
    # img_size: 224 # TODO: not being used
    batch_size: 64
    dl_weight_type: "root" # how each dataloader is weighted according to number of batches. "equal", "invlinear", "root"
    num_data_workers: 0
    wandb: true
    wandb_entity: "samanrod" # your wandb username
    log_freq: 10 # how often to log to wandb
    save_model: true
    finetune_from: "" # path to a model to finetune / load from
    # Will train for total_train_steps, during which will run eval for test_steps every test_every steps
    total_train_steps: 100000
    test_every: 750
    test_steps: 50
    generate_mae_visualizations: true

    # whether to freeze the encoder and trunk
    freeze_encoder: false
    freeze_trunk: false
    # whether to unfreeze the encoder and trunk at a given step. only effective when both freeze_encoder and freeze_trunk are true
    scheduled_unfreeze: false 
    scheduled_unfreeze_step: 20000

    optimizer:
      _target_: torch.optim.AdamW
      lr: 1.0e-4
      eps: 1.0e-6
      weight_decay: 0.1
    # the head and stem are updated at different frequencies. they can be trained with less learning rates.
    nontrunk_lr_scale: 1.0 # 0.5

    scheduler:
      _target_: torch.optim.lr_scheduler.CosineAnnealingLR
      T_max: ${train.total_train_steps}
      eta_min: 1e-8

  defaults:
    - _self_
    - network: pretrain1_mae_touch2touch
    - datasets: 
      - touch2touch_mae

  # Network configuration for pretraining I with MAE
  patch_size: 16
  encoder_embed_dim: 384
  encoder_heads: 6
  encoder_depth: 3
  trunk_depth: 9
  mask_ratio: 0.4

  encoders:
    bubbles:
      _target_: t3.models.MAEViTEncoder
      mask_ratio: ${mask_ratio}
      patch_size: ${patch_size}
      embed_dim: ${encoder_embed_dim}
      depth: ${encoder_depth}
      num_heads: ${encoder_heads}
      mlp_ratio: 4. 

    gelslims:
      _target_: t3.models.MAEViTEncoder
      mask_ratio: ${mask_ratio}
      patch_size: ${patch_size}
      embed_dim: ${encoder_embed_dim}
      depth: ${encoder_depth}
      num_heads: ${encoder_heads}
      mlp_ratio: 4. 
      
  shared_trunk:
    _target_: t3.models.TransformerTrunk
    embed_dim: ${encoder_embed_dim}
    depth: ${trunk_depth}
    num_heads: ${encoder_heads}
    mlp_ratio: 4.
    pooling_type: "cls"

  decoders:
    mae_recon_single:
      _target_: t3.models.MAEViTDecoder
      patch_size: ${patch_size}
      embed_dim: ${encoder_embed_dim}
      decoder_embed_dim: 512
      decoder_depth: 8
      decoder_num_heads: 16
      mlp_ratio: 4. 
      loss_func:
        _target_: t3.models.MAEReconLoss
        patch_size: 16
        norm_pix_loss: true # true for better representation learning, false for pixel-based loss for better reconstruction aka visualization

  # Dataset configuration
  bubbles:
    activate: true
    eval_only: false
    data_loader:
      _target_: t3.data_loader.SingleTowerMAETouch2Touch
      data_dir: "/home/samanta/tactile_style_transfer/new_processed_data/bubbles"
      encoder_domain: "bubbles"
      decoder_domain: "mae_recon_single"
      img_norm:
        mean: [0.0048, 0.0048, 0.0048]
        std: [0.0047, 0.0047, 0.0047]

  gelslims:
    activate: true
    eval_only: false
    data_loader:
      _target_: t3.data_loader.SingleTowerMAETouch2Touch
      data_dir: "/home/samanta/tactile_style_transfer/new_processed_data/gelslims"
      encoder_domain: "gelslims"
      decoder_domain: "mae_recon_single"
      img_norm:
        mean: [-0.0107, -0.0063, -0.0087]
        std: [0.0687, 0.0428, 0.0576]