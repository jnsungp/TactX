# ============================================================
# New 10-object static dataset — tactile_benchmark/data/latent_data_new_processed.
# Objects (10): circle cylinder cylinder_vertical ellipse large_ball plane
#               plane_horizontal small_ball square triangle
# Each pair (de/ef/fd) has the same per-object episode counts (verified):
#   circle 92, cylinder 86, cylinder_vertical 70, ellipse 93, large_ball 80,
#   plane 107, plane_horizontal 92, small_ball 150, square 40, triangle 80
#
# Per-object val split (~20%). Each object's episodes were collected as the
# concatenation of two sweeps (front half = left-sensor_a / right-sensor_b,
# back half = left-sensor_b / right-sensor_a). Picking only the tail as val
# would bias the contact distribution between train and val, so val ids are
# sampled by even stride across BOTH halves. The loader (datasets_sachin.py)
# accepts val_episode_ids as a {object_name: [ep_ids, ...]} dict and applies
# each list only to that object's frames.
#
# Stats are pooled `combined_static` over all 10 objects, recomputed via:
#   python scripts/compute_per_object_stats.py \
