  daimon_transforms:
    - 'resize'
    - 'normalize'
  daimon_stats:
    mean: [0.075014, -0.010031, -0.017616]
    std:  [0.219750, 0.102873, 0.097109]

  eflesh_transforms:
    - 'normalize'
