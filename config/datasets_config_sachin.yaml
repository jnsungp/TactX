    std:  [680.086060, 1364.270508, 517.791931, 1804.439331, 484.050659, 1545.929688, 595.985901, 2031.554932, 1672.495728, 592.037659, 2192.061768, 738.748596, 2003.141113, 318.000000, 530.152588]

  flexitac_transforms:
