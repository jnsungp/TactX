# Sachin variant of dataset_cross_modal_tri_object — same data, same stats,
# but with per-pair geometric corrections (rot180) applied at __getitem__
# time. Used to align contact points across sensors when the original
# preprocessed .pt files have wrong-axis mirroring baked in. Does not
# modify the .pt files themselves.
#
# Per-pair corrections (rot180 = undo wrong fliplr + apply correct flipud):
#   de_pair: rotate Daimon (sensor_a)
#   ef_pair: rotate Flexi  (sensor_b)
#   fd_pair: rotate Daimon (sensor_b) — verified visually with
#            scripts/visualize_paired_episodes_v2.py --daimon_transform rot180
#
# Loaded by joint_embedding_learning/data/datasets_sachin.py.

dataset_sachin:
  dataset_type: 'cross_modal_tri'
  data_root: 'latent_data_processed_object'

  image_size: 224

  # Pooled cyl+plug static stats — per_object_stats.yaml::combined_static.
  daimon_transforms:
    - 'resize'
    - 'normalize'
  daimon_stats:
    mean: [0.075429, -0.048488, -0.046264]
    std:  [0.199810, 0.139697, 0.119156]

  eflesh_transforms:
    - 'normalize'
  eflesh_stats:
    mean: [-14.108932, -292.387909, 139.747528, -1577.862305, 68.094353, 759.089417, 139.912811, 1915.957764, -698.633789, 28.534527, -2382.388184, -20.109350, -1304.386597, -42.433861, 232.194778]
    std:  [623.592651, 1262.216797, 464.669495, 1909.640259, 461.466766, 1413.119019, 538.769836, 1971.093628, 1369.160889, 477.245728, 2328.758789, 636.633301, 2016.120361, 276.599152, 515.429810]

  flexitac_transforms:
    - 'normalize'
  flexitac_stats:
    mean: 0.092914
    std:  0.187092

  pairs:
    de:
      sensor_a: 'daimon'
      sensor_b: 'eflesh'
      root:    'de_pair'
      extra_transforms_a: ['rot180']   # rotate Daimon
    ef:
      sensor_a: 'eflesh'
      sensor_b: 'flexi'
      root:    'ef_pair'
      extra_transforms_b: ['rot180']   # rotate Flexi
    fd:
      sensor_a: 'flexi'
      sensor_b: 'daimon'
      root:    'fd_pair'
      extra_transforms_b: ['rot180']   # rotate Daimon (sensor_b in this pair)

# ============================================================
# New paired-static dataset: latent_data_processed_static.
# Same pair layout / same per-pair rot180 corrections as dataset_sachin
# (data is "the same format" per upstream), but a different root and a
# larger object set:
#   circle, cylinder, ellipse, eraser, large_ball, line, plug,
#   small_ball, spam, triangle   (10 objects)
# No dynamic_data here — paired static only. Train via:
#   python scripts/train_static_sachin.py --dataset_name dataset_sachin_static \
#       --objects circle cylinder ellipse eraser large_ball line plug \
#                 small_ball spam triangle
#
# Stats below are carried over from dataset_sachin (combined cyl+plug) as a
# usable placeholder. RECOMPUTE for this dataset's objects once all data
# (incl. ef_pair / fd_pair FlexiTac) has landed:
#   python scripts/compute_per_object_stats.py \
#       --data_root latent_data_processed_static --splits static \
#       --objects circle cylinder ellipse eraser large_ball line plug \
#                 small_ball spam triangle
# then paste combined_static into the *_stats blocks below.
# ============================================================
dataset_sachin_static:
  dataset_type: 'cross_modal_tri'
  data_root: 'latent_data_processed_static'

  image_size: 224

  # Pooled stats over all 10 objects — per_object_stats.yaml::combined_static
