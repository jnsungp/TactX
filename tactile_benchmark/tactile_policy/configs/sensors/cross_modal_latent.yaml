sensor_type: "cross_modal_latent"
modality: "array"
tactile_dim: 64

# tactile img config (unused for array modality, kept for compatibility)
tactile_backbone: "resnet18"
tactile_image_feature_strategy: "ACT_linear"

# tactile array config
lr_tactile_backbone: 1e-4
tactile_encoding: "mlp"
tactile_hidden_layers: [128, 256]

spatial_resolution: [1, 64]
sampling_rate_hz: 100
