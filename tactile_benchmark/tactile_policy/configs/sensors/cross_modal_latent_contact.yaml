sensor_type: "cross_modal_latent"
modality: "array"
tactile_dim: 1

# tactile img config (unused for array modality, kept for compatibility)
tactile_backbone: "resnet18"
tactile_image_feature_strategy: "ACT_linear"

# Same MLP hidden layers as cross_modal_latent_z16.yaml ([64, 128]) so the
# only thing changing between the contact and z16 runs is the tactile input
# dim (1 vs 16), not the encoder capacity.
lr_tactile_backbone: 1e-4
tactile_encoding: "mlp"
tactile_hidden_layers: [64, 128]

spatial_resolution: [1, 1]
sampling_rate_hz: 100
