# =============================================================================
# Conda environment for the cross_modal_tactile (CMT) project.
#
# HOW TO CREATE AND ACTIVATE THE `cmt` ENVIRONMENT
# -----------------------------------------------------------------------------
#   1. Create the environment from this file (run once, from the repo root):
#          conda env create -f conda_environment.yaml
#
#   2. Activate it (run in every new shell before training/eval):
#          conda activate cmt
#
#      If `conda activate` fails in a fresh shell, initialize conda once:
#          conda init bash      # then close and reopen the terminal
#
#   3. Verify the install:
#          python -c "import torch, simclr; print(torch.__version__)"
#
# MAINTENANCE
# -----------------------------------------------------------------------------
#   - Apply changes after editing this file:
#          conda env update -f conda_environment.yaml --prune
#   - Delete the environment:
#          conda env remove -n cmt
#   - Deactivate (back to base):
#          conda deactivate
# =============================================================================

name: cmt
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch (CUDA 12.4)
  - pytorch::pytorch=2.5.1
  - pytorch::torchvision=0.20.1
  - pytorch::pytorch-cuda=12.4

  # Core scientific libraries
  - numpy=1.26.4
  - scipy=1.10.1
  - scikit-learn          # eval: t-SNE + logistic/ridge probes (eval_cross_modal_vae3_new.py)
  - matplotlib            # plots in eval / build_contact_labels

  # Image processing
  - pillow

  # Config & utilities
  - pyyaml                # load yaml configs (datasets_config*, models_config)
  - tqdm                  # training/eval progress bars

  # Experiment tracking
  - conda-forge::wandb    # training logging (train_*_sachin.py)

  # Jupyter environment (optional, for notebooks/analysis)
  - jupyter
  - jupyterlab
  - ipython
  - ipykernel

  # pip-only packages
  - pip
  - pip:
    # External SimCLR implementation (NOT the local code) — provides
    # get_resnet (Daimon ResNet backbone) and NT_Xent, imported by
    # models_setup.py, utils.py and data/datasets.py. Required.
    - git+https://github.com/Spijkervet/SimCLR.git

    # Editable install of this repo so `import joint_embedding_learning` works.
    # Adjust the path if you cloned the repo elsewhere.
    - -e /home/junsung/cross_modal_tactile
